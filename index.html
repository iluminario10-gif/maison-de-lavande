<script>
/*
 * Tela Vendas: lista do mês, indicadores e formulário com cálculo ao vivo.
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;
  const { esc, dinheiro, quantidade, ler } = UI;

  function vendasDoMes(mes) {
    return Store.get().vendas
      .filter((v) => Calc.mesDe(v.data) === mes)
      .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
  }

  function itemVenda(v) {
    return '<div class="item">' +
      '<div class="item-main" role="button" tabindex="0" data-act="vendas.editar" data-id="' + esc(v.id) + '">' +
        '<div class="item-title">' + esc(v.nomeProduto) + ' · ' + quantidade(v.quantidade) + ' un</div>' +
        '<div class="item-meta">' + UI.dataBR(v.data) + ' · ' + esc(v.formaPagamento) + '</div>' +
      '</div>' +
      '<div class="item-right">' +
        '<div class="money">' + dinheiro(v.valorTotal) + '</div>' +
        '<div class="small up">lucro ' + dinheiro(v.lucro) + '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const s = Store.get();
    const mes = UI.state.mes;
    const r = Calc.resumoMes(s.vendas, mes);
    const lista = vendasDoMes(mes).map(Calc.calcVenda);

    return '' +
      '<div class="screen-head">' +
        '<div><h1>Vendas</h1><div class="muted small">Registre cada venda. O lucro é calculado automaticamente.</div></div>' +
        '<button class="btn btn-primary" data-act="vendas.nova">+ Nova venda</button>' +
      '</div>' +
      root.Views.mesNav() +
      '<div class="kpis mt">' +
        '<div class="kpi"><div class="kpi-label">Faturamento</div><div class="kpi-value">' + dinheiro(r.faturamento) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Lucro</div><div class="kpi-value up">' + dinheiro(r.lucro) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Pedidos</div><div class="kpi-value">' + r.pedidos + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Unidades</div><div class="kpi-value">' + quantidade(r.unidades) + '</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title"><h3>Vendas de ' + Calc.nomeMes(mes) + '</h3>' +
        '<span class="muted small">' + lista.length + ' registro(s)</span></div>' +
        (lista.length
          ? '<div class="list">' + lista.map(itemVenda).join('') + '</div>'
          : UI.vazio('Nenhuma venda neste mês', 'Toque em “Nova venda” para registrar a primeira.')) +
      '</div>';
  }

  // ----- formulário -----
  function formVenda(venda, produtos) {
    const v = venda || {};
    const hoje = v.data || Calc.hojeISO();
    const preco = v.precoUnitario !== undefined ? String(v.precoUnitario).replace('.', ',') : '';
    const custo = v.custoUnitario !== undefined ? String(v.custoUnitario).replace('.', ',') : '';
    return '' +
      '<div class="form-grid">' +
        '<div class="field"><label for="v-data">Data</label><input id="v-data" type="date" value="' + esc(hoje) + '"></div>' +
        '<div class="field"><label for="v-qtd">Quantidade</label><input id="v-qtd" inputmode="numeric" value="' + esc(v.quantidade || 1) + '"></div>' +
        '<div class="field full"><label for="v-produto">Produto</label><select id="v-produto">' + UI.opcoesProdutos(produtos, v.produtoId) + '</select></div>' +
        '<div class="field"><label for="v-preco">Valor de venda (un.)</label><input id="v-preco" inputmode="decimal" value="' + esc(preco) + '" placeholder="0,00"></div>' +
        '<div class="field"><label for="v-custo">Custo (un.)</label><input id="v-custo" inputmode="decimal" value="' + esc(custo) + '" placeholder="0,00"></div>' +
        '<div class="field full"><label for="v-forma">Forma de pagamento</label><select id="v-forma">' + UI.opcoesPagamento(v.formaPagamento, Calc.FORMAS_PAGAMENTO) + '</select></div>' +
        '<div class="field full"><label for="v-obs">Observação (opcional)</label><textarea id="v-obs" maxlength="200">' + esc(v.observacao || '') + '</textarea></div>' +
        '<div class="calc-box" id="v-calc"></div>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn" data-fechar>Cancelar</button>' +
        '<button class="btn btn-primary" data-act="vendas.salvar" data-id="' + esc(v.id || '') + '">Salvar venda</button>' +
      '</div>' +
      (v.id ? '<div class="form-actions"><button class="btn btn-danger btn-block" data-act="vendas.excluir" data-id="' + esc(v.id) + '">Excluir esta venda</button></div>' : '');
  }

  function lerForm(sheet) {
    const q = (sel) => sheet.querySelector(sel).value;
    const produto = Store.get().produtos.find((p) => p.id === q('#v-produto'));
    const qtd = ler(q('#v-qtd'));
    return {
      data: q('#v-data'),
      produtoId: q('#v-produto'),
      nomeProduto: produto ? produto.nome : '',
      quantidade: Number.isNaN(qtd) ? NaN : qtd,
      precoUnitario: ler(q('#v-preco')),
      custoUnitario: ler(q('#v-custo')),
      formaPagamento: q('#v-forma'),
      observacao: q('#v-obs').trim(),
    };
  }

  // Quanto ainda há disponível; ao editar, a própria venda volta a contar.
  function disponivel(produtoId, idEditando) {
    const s = Store.get();
    const saldo = Calc.saldosPorProduto(s)[produtoId];
    if (saldo === undefined) return 0;
    if (idEditando) {
      const original = s.vendas.find((x) => x.id === idEditando);
      if (original && original.produtoId === produtoId) return saldo + Number(original.quantidade);
    }
    return saldo;
  }

  function atualizarCalc(sheet, idEditando) {
    const box = sheet.querySelector('#v-calc');
    const v = lerForm(sheet);
    const ok = Number(v.quantidade) > 0 && v.precoUnitario >= 0 && v.custoUnitario >= 0;
    if (!ok || !v.produtoId) {
      box.innerHTML = '<div class="full muted small">Preencha produto, quantidade e valores para ver o total e o lucro.</div>';
      return;
    }
    const c = Calc.calcVenda(v);
    const { avisos } = Calc.validarVenda(v, disponivel(v.produtoId, idEditando));
    box.innerHTML =
      '<div>Total da venda<div class="v">' + dinheiro(c.valorTotal) + '</div></div>' +
      '<div>Custo total<div class="v">' + dinheiro(c.custoTotal) + '</div></div>' +
      '<div>Lucro<div class="v up">' + dinheiro(c.lucro) + '</div></div>' +
      '<div>Margem<div class="v">' + UI.percentual(c.margem) + '</div></div>' +
      (avisos.length ? '<div class="warn-line">' + esc(avisos[0]) + '</div>' : '');
  }

  function abrirForm(venda) {
    const produtos = Store.get().produtos;
    const idEditando = venda ? venda.id : null;
    UI.abrirFolha(venda ? 'Editar venda' : 'Nova venda', formVenda(venda, produtos), (sheet) => {
      const prod = sheet.querySelector('#v-produto');
      prod.addEventListener('change', () => {
        const p = Store.get().produtos.find((x) => x.id === prod.value);
        if (p) {
          sheet.querySelector('#v-preco').value = String(p.precoVenda || 0).replace('.', ',');
          sheet.querySelector('#v-custo').value = String(p.custoAtual || 0).replace('.', ',');
        }
        atualizarCalc(sheet, idEditando);
      });
      sheet.querySelectorAll('input, select, textarea').forEach((el) => el.addEventListener('input', () => atualizarCalc(sheet, idEditando)));
      sheet.querySelectorAll('select').forEach((el) => el.addEventListener('change', () => atualizarCalc(sheet, idEditando)));
      atualizarCalc(sheet, idEditando);
    });
  }

  function salvar(id, sheet) {
    const v = lerForm(sheet);
    const { erros, avisos } = Calc.validarVenda(v, disponivel(v.produtoId, id));
    const erroBox = sheet.querySelector('#v-calc');
    if (erros.length) {
      erroBox.innerHTML = erros.map((e) => '<div class="err-line">' + esc(e) + '</div>').join('');
      return;
    }
    const dados = Object.assign({}, v, { quantidade: Number(v.quantidade) });
    if (id) Store.updateVenda(id, dados);
    else Store.addVenda(dados);
    UI.fecharFolha();
    UI.toast(avisos.length ? 'Venda salva. ' + avisos[0] : 'Venda salva');
    root.App.rerender();
  }

  const Vendas = {
    render,
    acao(nome, el) {
      const id = el && el.dataset.id;
      if (nome === 'nova') return abrirForm(null);
      if (nome === 'editar') {
        const v = Store.get().vendas.find((x) => x.id === id);
        if (v) abrirForm(v);
        return;
      }
      if (nome === 'salvar') {
        const sheet = el.closest('.sheet');
        return salvar(id || null, sheet);
      }
      if (nome === 'excluir') {
        if (!window.confirm('Excluir esta venda? O estoque e os totais serão recalculados.')) return;
        Store.removerVenda(id);
        UI.fecharFolha();
        UI.toast('Venda excluída');
        root.App.rerender();
      }
    },
  };

  root.Views = root.Views || {};
  root.Views.vendas = Vendas;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Tela Compras: registra compras para reposição e calcula o preço final de venda
 * a partir do custo e do percentual de acréscimo.
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;
  const { esc, dinheiro, quantidade, ler } = UI;

  function comprasDoMes(mes) {
    return Store.get().compras
      .filter((c) => Calc.mesDe(c.data) === mes)
      .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0))
      .map(Calc.calcCompra);
  }

  function itemCompra(c) {
    return '<div class="item">' +
      '<div class="item-main">' +
        '<div class="item-title">' + esc(c.nomeProduto) + ' · ' + quantidade(c.quantidade) + ' un</div>' +
        '<div class="item-meta">' + UI.dataBR(c.data) + (c.fornecedor ? ' · ' + esc(c.fornecedor) : '') +
        ' · acréscimo ' + UI.percentual(c.acrescimo) + ' → venda ' + dinheiro(c.precoVendaSugerido) + '</div>' +
      '</div>' +
      '<div class="item-right">' +
        '<div class="money">' + dinheiro(c.custoTotal) + '</div>' +
        '<button class="item-btn" data-act="compras.excluir" data-id="' + esc(c.id) + '">Excluir</button>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const mes = UI.state.mes;
    const lista = comprasDoMes(mes);
    const investido = lista.reduce((s, c) => s + c.custoTotal, 0);
    const unidades = lista.reduce((s, c) => s + Number(c.quantidade), 0);

    return '' +
      '<div class="screen-head">' +
        '<div><h1>Compras</h1><div class="muted small">Registre o que comprou. O preço de venda sai do custo + acréscimo.</div></div>' +
        '<button class="btn btn-primary" data-act="compras.nova">+ Nova compra</button>' +
      '</div>' +
      root.Views.mesNav() +
      '<div class="kpis mt">' +
        '<div class="kpi"><div class="kpi-label">Investido</div><div class="kpi-value">' + dinheiro(investido) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Unidades</div><div class="kpi-value">' + quantidade(unidades) + '</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title"><h3>Compras de ' + Calc.nomeMes(mes) + '</h3><span class="muted small">' + lista.length + ' registro(s)</span></div>' +
        (lista.length
          ? '<div class="list">' + lista.map(itemCompra).join('') + '</div>'
          : UI.vazio('Nenhuma compra neste mês', 'Registre compras para atualizar o estoque e os preços.')) +
      '</div>';
  }

  function formCompra(compra, produtos) {
    const c = compra || {};
    const hoje = c.data || Calc.hojeISO();
    const cu = c.custoUnitario !== undefined ? String(c.custoUnitario).replace('.', ',') : '';
    const ac = c.acrescimo !== undefined ? String(c.acrescimo).replace('.', ',') : '';
    return '' +
      '<div class="form-grid">' +
        '<div class="field"><label for="c-data">Data</label><input id="c-data" type="date" value="' + esc(hoje) + '"></div>' +
        '<div class="field"><label for="c-qtd">Quantidade</label><input id="c-qtd" inputmode="numeric" value="' + esc(c.quantidade || '') + '"></div>' +
        '<div class="field full"><label for="c-produto">Produto</label><select id="c-produto">' + UI.opcoesProdutos(produtos, c.produtoId) + '</select></div>' +
        '<div class="field"><label for="c-custo">Custo unitário</label><input id="c-custo" inputmode="decimal" value="' + esc(cu) + '" placeholder="0,00"></div>' +
        '<div class="field"><label for="c-acres">Acréscimo (%)</label><input id="c-acres" inputmode="decimal" value="' + esc(ac) + '" placeholder="100"></div>' +
        '<div class="field full"><label for="c-forn">Fornecedor (opcional)</label><input id="c-forn" value="' + esc(c.fornecedor || '') + '"></div>' +
        '<div class="field full"><label class="row small" style="font-weight:600;color:var(--ink)"><input type="checkbox" id="c-atualizar" checked> Usar este custo e acréscimo como padrão do produto</label></div>' +
        '<div class="calc-box" id="c-calc"></div>' +
      '</div>' +
      '<div class="form-actions"><button class="btn" data-fechar>Cancelar</button>' +
      '<button class="btn btn-primary" data-act="compras.salvar">Salvar compra</button></div>';
  }

  function lerForm(sheet) {
    const q = (sel) => sheet.querySelector(sel).value;
    const produto = Store.get().produtos.find((p) => p.id === q('#c-produto'));
    const qtd = ler(q('#c-qtd'));
    return {
      data: q('#c-data'),
      produtoId: q('#c-produto'),
      nomeProduto: produto ? produto.nome : '',
      quantidade: Number.isNaN(qtd) ? NaN : qtd,
      custoUnitario: ler(q('#c-custo')),
      acrescimo: ler(q('#c-acres')),
      fornecedor: q('#c-forn').trim(),
      atualizarProduto: sheet.querySelector('#c-atualizar').checked,
    };
  }

  function atualizarCalc(sheet) {
    const box = sheet.querySelector('#c-calc');
    const v = lerForm(sheet);
    if (!(v.custoUnitario >= 0) || !(v.acrescimo >= 0) || !v.produtoId || !(v.quantidade > 0)) {
      box.innerHTML = '<div class="full muted small">Informe produto, quantidade, custo e acréscimo para ver o preço final.</div>';
      return;
    }
    const c = Calc.calcCompra(v);
    const lucroUn = Calc.round2(c.precoVendaSugerido - v.custoUnitario);
    const margem = c.precoVendaSugerido > 0 ? Calc.round2((lucroUn / c.precoVendaSugerido) * 100) : 0;
    box.innerHTML =
      '<div>Custo total da compra<div class="v">' + dinheiro(c.custoTotal) + '</div></div>' +
      '<div>Preço final de venda<div class="v up">' + dinheiro(c.precoVendaSugerido) + '</div></div>' +
      '<div>Lucro por unidade<div class="v">' + dinheiro(lucroUn) + '</div></div>' +
      '<div>Margem<div class="v">' + UI.percentual(margem) + '</div></div>';
  }

  function abrirForm(opcoes) {
    const o = opcoes || {};
    const produtos = Store.get().produtos;
    const base = o.produtoId ? produtos.find((p) => p.id === o.produtoId) : null;
    const inicial = base
      ? { produtoId: base.id, custoUnitario: base.custoAtual || 0, acrescimo: base.acrescimo || 0, quantidade: o.quantidade || '' }
      : (o.compra || null);
    UI.abrirFolha('Nova compra', formCompra(inicial, produtos), (sheet) => {
      const prod = sheet.querySelector('#c-produto');
      prod.addEventListener('change', () => {
        const p = Store.get().produtos.find((x) => x.id === prod.value);
        if (p) {
          sheet.querySelector('#c-custo').value = String(p.custoAtual || 0).replace('.', ',');
          sheet.querySelector('#c-acres').value = String(p.acrescimo || 0).replace('.', ',');
        }
        atualizarCalc(sheet);
      });
      sheet.querySelectorAll('input, select').forEach((el) => {
        el.addEventListener('input', () => atualizarCalc(sheet));
        el.addEventListener('change', () => atualizarCalc(sheet));
      });
      atualizarCalc(sheet);
    });
  }

  function salvar(sheet) {
    const v = lerForm(sheet);
    const erros = Calc.validarCompra(v);
    if (erros.length) {
      sheet.querySelector('#c-calc').innerHTML = erros.map((e) => '<div class="err-line">' + esc(e) + '</div>').join('');
      return;
    }
    const precoVenda = Calc.precoFinal(v.custoUnitario, v.acrescimo);
    const compra = {
      data: v.data,
      produtoId: v.produtoId,
      nomeProduto: v.nomeProduto,
      quantidade: Number(v.quantidade),
      custoUnitario: v.custoUnitario,
      acrescimo: v.acrescimo,
      precoVenda,
      fornecedor: v.fornecedor,
    };
    Store.addCompra(compra);
    if (v.atualizarProduto) {
      Store.updateProduto(v.produtoId, {
        custoAtual: v.custoUnitario,
        acrescimo: v.acrescimo,
        precoVenda,
      });
    }
    UI.fecharFolha();
    UI.toast('Compra salva · estoque atualizado');
    root.App.rerender();
  }

  const Compras = {
    render,
    abrirForm,
    acao(nome, el) {
      if (nome === 'nova') return abrirForm({});
      if (nome === 'repor') {
        return abrirForm({ produtoId: el.dataset.produto, quantidade: Number(el.dataset.qtd) || '' });
      }
      if (nome === 'salvar') return salvar(el.closest('.sheet'));
      if (nome === 'excluir') {
        if (!window.confirm('Excluir esta compra? O estoque será recalculado.')) return;
        Store.removerCompra(el.dataset.id);
        UI.toast('Compra excluída');
        root.App.rerender();
      }
    },
  };

  root.Views = root.Views || {};
  root.Views.compras = Compras;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Tela Estoque: saldo atual, cobertura em dias, o que repor e ajustes manuais.
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;
  const { esc, dinheiro, quantidade, ler } = UI;

  const ROTULO = {
    esgotado: 'Esgotado',
    repor: 'Repor',
    atencao: 'Atenção',
    ok: 'OK',
    parado: 'Sem giro',
  };

  const MOTIVOS = ['Contagem', 'Perda ou avaria', 'Brinde ou amostra', 'Entrada sem compra', 'Outro'];

  function linhaProduto(a, produto) {
    const cobertura = a.coberturaDias === null ? 'sem vendas recentes' : a.coberturaDias + ' dias de cobertura';
    const acao = (a.status === 'repor' || a.status === 'esgotado') && a.sugestaoCompra > 0
      ? '<button class="btn btn-sm btn-primary" data-act="compras.repor" data-produto="' + esc(a.produtoId) + '" data-qtd="' + a.sugestaoCompra + '">Repor ' + a.sugestaoCompra + '</button>'
      : '';
    return '<div class="item">' +
      '<div class="item-main">' +
        '<div class="item-title">' + esc(a.nome) + '</div>' +
        '<div class="item-meta">Em estoque: <strong>' + quantidade(a.estoque) + '</strong> un · ' +
        'vendeu ' + quantidade(a.vendas60) + ' em 60 dias · ' + cobertura + '</div>' +
      '</div>' +
      '<div class="item-right">' +
        '<span class="badge b-' + a.status + '">' + ROTULO[a.status] + '</span>' +
        '<div class="row" style="justify-content:flex-end;margin-top:6px">' +
          acao +
          '<button class="item-btn" data-act="estoque.ajuste" data-produto="' + esc(a.produtoId) + '">Ajustar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const s = Store.get();
    const analise = Calc.analiseReposicao(s, Calc.hojeISO());
    const ativos = s.produtos.filter((p) => p.ativo !== false);

    if (!ativos.length) {
      return '<div class="screen-head"><div><h1>Estoque</h1></div></div>' +
        UI.vazio('Nenhum produto cadastrado', 'Cadastre seus produtos na aba Produtos para acompanhar o estoque.');
    }

    const saldos = Calc.saldosPorProduto(s);
    const valorEstoque = ativos.reduce((acc, p) => acc + Math.max(0, saldos[p.id] || 0) * Number(p.custoAtual || 0), 0);
    const contagem = (st) => analise.filter((a) => a.status === st).length;
    const precisamRepor = analise.filter((a) => a.status === 'repor' || a.status === 'esgotado');
    const atencao = analise.filter((a) => a.status === 'atencao');
    const restante = analise.filter((a) => a.status === 'ok' || a.status === 'parado');

    const grupo = (titulo, lista, vazioTexto) => '<div class="card">' +
      '<div class="card-title"><h3>' + titulo + '</h3><span class="muted small">' + lista.length + '</span></div>' +
      (lista.length ? '<div class="list">' + lista.map((a) => linhaProduto(a, ativos.find((p) => p.id === a.produtoId))).join('') + '</div>'
        : '<div class="muted small">' + vazioTexto + '</div>') +
      '</div>';

    return '' +
      '<div class="screen-head">' +
        '<div><h1>Estoque</h1><div class="muted small">Calculado a partir de compras, vendas e ajustes. Giro dos últimos 60 dias.</div></div>' +
      '</div>' +
      '<div class="kpis">' +
        '<div class="kpi"><div class="kpi-label">Repor agora</div><div class="kpi-value down">' + (contagem('repor') + contagem('esgotado')) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Atenção</div><div class="kpi-value">' + contagem('atencao') + '</div></div>' +
        '<div class="kpi wide"><div class="kpi-label">Valor parado em estoque (custo)</div><div class="kpi-value">' + dinheiro(valorEstoque) + '</div></div>' +
      '</div>' +
      grupo('Precisam de reposição', precisamRepor, 'Nada urgente. Bom sinal.') +
      grupo('Atenção nas próximas semanas', atencao, 'Nenhum produto nesse ponto.') +
      grupo('Estoque confortável ou sem giro', restante, 'Nenhum produto nesta faixa.') +
      '<div class="footer-note">Sugestão de reposição = venda média diária × 30 dias + estoque mínimo − saldo atual.</div>';
  }

  function formAjuste(produtoId) {
    const produtos = Store.get().produtos;
    return '' +
      '<div class="form-grid">' +
        '<div class="field"><label for="a-data">Data</label><input id="a-data" type="date" value="' + Calc.hojeISO() + '"></div>' +
        '<div class="field"><label for="a-qtd">Quantidade (use − para saída)</label><input id="a-qtd" inputmode="numeric" placeholder="ex.: -2 ou 5"></div>' +
        '<div class="field full"><label for="a-produto">Produto</label><select id="a-produto">' + UI.opcoesProdutos(produtos, produtoId) + '</select></div>' +
        '<div class="field full"><label for="a-motivo">Motivo</label><select id="a-motivo">' + MOTIVOS.map((m) => '<option>' + esc(m) + '</option>').join('') + '</select></div>' +
        '<div class="calc-box" id="a-calc"><div class="full muted small">Use para registrar contagem de prateleira, perdas ou brindes.</div></div>' +
      '</div>' +
      '<div class="form-actions"><button class="btn" data-fechar>Cancelar</button>' +
      '<button class="btn btn-primary" data-act="estoque.salvarAjuste">Salvar ajuste</button></div>';
  }

  function abrirAjuste(produtoId) {
    UI.abrirFolha('Ajustar estoque', formAjuste(produtoId), null);
  }

  function salvarAjuste(sheet) {
    const q = (sel) => sheet.querySelector(sel).value;
    const qtd = ler(q('#a-qtd'));
    const produto = Store.get().produtos.find((p) => p.id === q('#a-produto'));
    const box = sheet.querySelector('#a-calc');
    if (!produto) { box.innerHTML = '<div class="err-line">Escolha um produto.</div>'; return; }
    if (!Number.isInteger(qtd) || qtd === 0) { box.innerHTML = '<div class="err-line">Informe um número inteiro diferente de zero.</div>'; return; }
    Store.addAjuste({ data: q('#a-data'), produtoId: produto.id, nomeProduto: produto.nome, quantidade: qtd, motivo: q('#a-motivo') });
    UI.fecharFolha();
    UI.toast('Ajuste registrado');
    root.App.rerender();
  }

  root.Views = root.Views || {};
  root.Views.estoque = {
    render,
    acao(nome, el) {
      if (nome === 'ajuste') return abrirAjuste(el.dataset.produto);
      if (nome === 'salvarAjuste') return salvarAjuste(el.closest('.sheet'));
    },
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Tela Produtos: cadastro fixo. Informações ficam aqui e não precisam ser digitadas de novo.
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;
  const { esc, dinheiro, quantidade, ler } = UI;

  const UNIDADES = ['un', 'kit', 'par', 'caixa', 'ml', 'g'];

  function render() {
    const s = Store.get();
    const ativos = s.produtos.filter((p) => p.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    const saldos = Calc.saldosPorProduto(s);

    const itens = ativos.map((p) => '' +
      '<div class="item" data-busca="' + esc((p.nome + ' ' + (p.codigo || '') + ' ' + (p.categoria || '')).toLowerCase()) + '">' +
        '<div class="item-main" role="button" tabindex="0" data-act="produtos.editar" data-id="' + esc(p.id) + '">' +
          '<div class="item-title">' + esc(p.nome) + '</div>' +
          '<div class="item-meta">' + (p.categoria ? esc(p.categoria) + ' · ' : '') +
          (p.codigo ? 'cód. ' + esc(p.codigo) + ' · ' : '') + 'custo ' + dinheiro(p.custoAtual) +
          ' · acréscimo ' + UI.percentual(p.acrescimo) + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="money">' + dinheiro(p.precoVenda) + '</div>' +
          '<div class="small muted">' + quantidade(saldos[p.id] || 0) + ' un em estoque</div>' +
        '</div>' +
      '</div>').join('');

    return '' +
      '<div class="screen-head">' +
        '<div><h1>Produtos</h1><div class="muted small">Cadastro fixo. Custo, acréscimo e preço ficam salvos aqui.</div></div>' +
        '<button class="btn btn-primary" data-act="produtos.novo">+ Novo produto</button>' +
      '</div>' +
      (ativos.length
        ? '<div class="field" style="margin-bottom:12px"><input id="busca-produtos" type="search" placeholder="Buscar por nome, código ou categoria" style="width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none"></div>' +
          '<div class="card"><div class="list" id="lista-produtos">' + itens + '</div>' +
          '<div class="empty" id="sem-resultado" hidden>Nenhum produto encontrado.</div></div>'
        : UI.vazio('Nenhum produto ainda', 'Cadastre o primeiro produto. Depois ele aparece nas vendas e compras.'));
  }

  // Filtra a lista sem redesenhar a tela (chamado depois de cada render).
  function depois(main) {
    const busca = main.querySelector('#busca-produtos');
    if (!busca) return;
    busca.addEventListener('input', () => {
      const termo = busca.value.trim().toLowerCase();
      let achou = 0;
      main.querySelectorAll('#lista-produtos .item').forEach((el) => {
        const ok = !termo || el.dataset.busca.includes(termo);
        el.hidden = !ok;
        if (ok) achou++;
      });
      main.querySelector('#sem-resultado').hidden = achou > 0;
    });
  }

  function formProduto(p) {
    const v = p || {};
    const campo = (x) => (x === undefined || x === null ? '' : String(x).replace('.', ','));
    return '' +
      '<div class="form-grid">' +
        '<div class="field full"><label for="p-nome">Nome do produto</label><input id="p-nome" value="' + esc(v.nome || '') + '" placeholder="ex.: Sabonete de lavanda 90g"></div>' +
        '<div class="field"><label for="p-codigo">Código (opcional)</label><input id="p-codigo" value="' + esc(v.codigo || '') + '"></div>' +
        '<div class="field"><label for="p-cat">Categoria</label><input id="p-cat" value="' + esc(v.categoria || '') + '" placeholder="ex.: Banho"></div>' +
        '<div class="field"><label for="p-un">Unidade</label><select id="p-un">' + UNIDADES.map((u) => '<option' + ((v.unidade || 'un') === u ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></div>' +
        '<div class="field"><label for="p-custo">Custo unitário</label><input id="p-custo" inputmode="decimal" value="' + campo(v.custoAtual) + '" placeholder="0,00"></div>' +
        '<div class="field"><label for="p-acres">Acréscimo padrão (%)</label><input id="p-acres" inputmode="decimal" value="' + (v.id ? campo(v.acrescimo) : '100') + '"></div>' +
        '<div class="field"><label for="p-preco">Preço de venda</label><input id="p-preco" inputmode="decimal" value="' + campo(v.precoVenda) + '" placeholder="0,00"></div>' +
        '<div class="field"><label for="p-est">Estoque inicial</label><input id="p-est" inputmode="numeric" value="' + (v.estoqueInicial !== undefined ? v.estoqueInicial : 0) + '"></div>' +
        '<div class="field"><label for="p-min">Estoque mínimo (alerta)</label><input id="p-min" inputmode="numeric" value="' + (v.estoqueMinimo !== undefined ? v.estoqueMinimo : 0) + '"></div>' +
        '<div class="calc-box" id="p-calc"></div>' +
      '</div>' +
      '<div class="form-actions"><button class="btn" data-fechar>Cancelar</button>' +
      '<button class="btn btn-primary" data-act="produtos.salvar" data-id="' + esc(v.id || '') + '">Salvar produto</button></div>' +
      (v.id ? '<div class="form-actions"><button class="btn btn-danger btn-block" data-act="produtos.desativar" data-id="' + esc(v.id) + '">Desativar produto</button></div>' : '');
  }

  function lerForm(sheet) {
    const q = (sel) => sheet.querySelector(sel).value;
    return {
      nome: q('#p-nome').trim(),
      codigo: q('#p-codigo').trim(),
      categoria: q('#p-cat').trim(),
      unidade: q('#p-un'),
      custoAtual: ler(q('#p-custo')),
      acrescimo: ler(q('#p-acres')),
      precoVenda: ler(q('#p-preco')),
      estoqueInicial: Number(ler(q('#p-est')) || 0),
      estoqueMinimo: Number(ler(q('#p-min')) || 0),
    };
  }

  function atualizarCalc(sheet) {
    const v = lerForm(sheet);
    const box = sheet.querySelector('#p-calc');
    if (!(v.custoAtual >= 0) || !(v.acrescimo >= 0)) {
      box.innerHTML = '<div class="full muted small">Informe custo e acréscimo para ver o preço sugerido.</div>';
      return;
    }
    const sugerido = Calc.precoFinal(v.custoAtual, v.acrescimo);
    box.innerHTML =
      '<div class="full">Preço sugerido (custo + ' + UI.percentual(v.acrescimo) + ')<div class="v up">' + dinheiro(sugerido) + '</div></div>' +
      '<div class="full"><button class="btn btn-sm" type="button" data-act="produtos.usarSugerido">Usar este preço de venda</button></div>';
  }

  function abrirForm(p) {
    UI.abrirFolha(p ? 'Editar produto' : 'Novo produto', formProduto(p), (sheet) => {
      sheet.querySelectorAll('input, select').forEach((el) => {
        el.addEventListener('input', () => atualizarCalc(sheet));
        el.addEventListener('change', () => atualizarCalc(sheet));
      });
      atualizarCalc(sheet);
    });
  }

  function salvar(id, sheet) {
    const v = lerForm(sheet);
    const erros = [];
    if (!v.nome) erros.push('Informe o nome do produto.');
    if (!(v.custoAtual >= 0)) erros.push('Informe o custo unitário.');
    if (!(v.acrescimo >= 0)) erros.push('Informe o acréscimo (0 ou mais).');
    if (!(v.precoVenda >= 0)) erros.push('Informe o preço de venda.');
    if (erros.length) {
      sheet.querySelector('#p-calc').innerHTML = erros.map((e) => '<div class="err-line">' + esc(e) + '</div>').join('');
      return;
    }
    if (id) Store.updateProduto(id, v);
    else Store.addProduto(Object.assign({ ativo: true }, v));
    UI.fecharFolha();
    UI.toast('Produto salvo');
    root.App.rerender();
  }

  root.Views = root.Views || {};
  root.Views.produtos = {
    render,
    depois,
    acao(nome, el) {
      const id = el && el.dataset.id;
      if (nome === 'novo') return abrirForm(null);
      if (nome === 'editar') {
        const p = Store.get().produtos.find((x) => x.id === id);
        if (p) abrirForm(p);
        return;
      }
      if (nome === 'salvar') return salvar(id || null, el.closest('.sheet'));
      if (nome === 'usarSugerido') {
        const sheet = el.closest('.sheet');
        const v = lerForm(sheet);
        sheet.querySelector('#p-preco').value = String(Calc.precoFinal(v.custoAtual, v.acrescimo)).replace('.', ',');
        return atualizarCalc(sheet);
      }
      if (nome === 'desativar') {
        if (!window.confirm('Desativar este produto? Ele sai das listas, mas o histórico de vendas e compras é mantido.')) return;
        Store.desativarProduto(id);
        UI.fecharFolha();
        UI.toast('Produto desativado');
        root.App.rerender();
      }
    },
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Configurações: nome da loja, backup, exportação para planilha, dados de exemplo e versões.
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;
  const { esc } = UI;

  const VERSAO_ATUAL = '1.0';

  const NOVIDADES = [
    {
      versao: '1.0',
      status: 'Versão atual',
      itens: [
        'Cadastro fixo de produtos (custo, acréscimo, preço, estoque inicial e mínimo).',
        'Vendas com data, produto, quantidade, valor, forma de pagamento; total, custo, lucro e margem são calculados sozinhos.',
        'Compras e reposição: preço final = custo + acréscimo, com opção de atualizar o preço do produto.',
        'Estoque automático (compras + ajustes − vendas), cobertura em dias e sugestão de quantidade para repor.',
        'Painel com indicadores do mês, gráfico dos últimos 12 meses, mais vendidos, formas de pagamento e comparação entre dois períodos.',
        'Backup em arquivo, exportação de vendas para planilha e uso no Chrome e no Android.',
      ],
    },
    {
      versao: '1.2',
      status: 'Planejada',
      itens: [
        'Editar e excluir compras e ajustes de estoque.',
        'Filtrar vendas por produto e forma de pagamento.',
        'Meta mensal de faturamento com barra de progresso no Painel.',
        'Importar planilhas (CSV) para trazer o histórico antigo de uma vez.',
        'Avisos de reposição ao abrir o app, sem precisar entrar no Estoque.',
      ],
    },
  ];

  const PRODUTOS_EXEMPLO = [
    { nome: 'Sabonete de lavanda 90g', codigo: 'SAB-01', categoria: 'Banho', custo: 6.5, acrescimo: 120, minimo: 10 },
    { nome: 'Óleo essencial de lavanda 10ml', codigo: 'OLE-10', categoria: 'Aromaterapia', custo: 14, acrescimo: 110, minimo: 5 },
    { nome: 'Vela aromática lavanda', codigo: 'VEL-01', categoria: 'Ambiente', custo: 18, acrescimo: 100, minimo: 6 },
    { nome: 'Sachê perfumado', codigo: 'SCH-01', categoria: 'Gavetas', custo: 3, acrescimo: 150, minimo: 15 },
    { nome: 'Difusor de varetas 100ml', codigo: 'DIF-100', categoria: 'Ambiente', custo: 22, acrescimo: 100, minimo: 4 },
    { nome: 'Spray de ambiente 240ml', codigo: 'SPR-24', categoria: 'Ambiente', custo: 11, acrescimo: 120, minimo: 6 },
    { nome: 'Sais de banho 500g', codigo: 'SAI-05', categoria: 'Banho', custo: 16, acrescimo: 100, minimo: 4 },
    { nome: 'Kit presente lavanda', codigo: 'KIT-01', categoria: 'Presentes', custo: 42, acrescimo: 90, minimo: 2 },
  ];

  function gerarExemplos() {
    let semente = 20260101;
    const rnd = () => (semente = (semente * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const formas = Calc.FORMAS_PAGAMENTO.slice(0, 4);
    const hoje = Calc.hojeISO();
    const mesAtual = Calc.mesDe(hoje);
    const diaHoje = Number(hoje.slice(8, 10));

    const produtos = PRODUTOS_EXEMPLO.map((p, i) => ({
      id: 'ex-p' + i, ativo: true, unidade: 'un', nome: p.nome, codigo: p.codigo, categoria: p.categoria,
      custoAtual: p.custo, acrescimo: p.acrescimo, precoVenda: Calc.precoFinal(p.custo, p.acrescimo),
      estoqueInicial: 0, estoqueMinimo: p.minimo,
    }));

    const compras = [];
    const vendas = [];
    let n = 0;
    for (let k = 11; k >= 0; k--) {
      const ym = Calc.deslocarMes(mesAtual, -k);
      const limiteDia = ym === mesAtual ? Math.max(1, diaHoje) : 28;
      produtos.forEach((p, idx) => {
        // Vendas do mês primeiro; a compra é calculada para acompanhar o que saiu.
        let vendido = 0;
        const vendasNoMes = ri(2, 5);
        for (let v = 0; v < vendasNoMes; v++) {
          const qtd = ri(1, 4);
          vendido += qtd;
          vendas.push({
            id: 'ex-v' + (++n), data: ym + '-' + String(ri(1, Math.min(28, limiteDia))).padStart(2, '0'),
            produtoId: p.id, nomeProduto: p.nome, quantidade: qtd,
            precoUnitario: p.precoVenda, custoUnitario: p.custoAtual,
            formaPagamento: formas[ri(0, formas.length - 1)], observacao: 'Dado de exemplo',
          });
        }
        // Dois produtos ficam com pouca compra no mês atual, para aparecer o alerta de reposição.
        const emFalta = ym === mesAtual && (idx === 2 || idx === 7);
        const qtdComprada = emFalta ? Math.max(0, vendido - 9) : vendido + ri(0, 2);
        compras.push({
          id: 'ex-c' + (++n), data: ym + '-' + String(ri(1, 3)).padStart(2, '0'),
          produtoId: p.id, nomeProduto: p.nome, quantidade: qtdComprada,
          custoUnitario: p.custoAtual, acrescimo: p.acrescimo, precoVenda: p.precoVenda,
          fornecedor: 'Fornecedor exemplo',
        });
      });
    }
    return { produtos, compras, vendas };
  }

  function baixar(nomeArquivo, conteudo, tipo) {
    const blob = new Blob([conteudo], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // CSV no formato que o Excel e o Planilhas do Google leem bem no Brasil (; e vírgula decimal).
  function csvVendas() {
    const dec = (n) => Number(n || 0).toFixed(2).replace('.', ',');
    const cab = ['Data', 'Produto', 'Quantidade', 'Valor unitário', 'Valor total', 'Custo unitário', 'Custo total', 'Lucro', 'Forma de pagamento', 'Observação'];
    const linhas = Store.get().vendas.slice().sort((a, b) => (a.data < b.data ? -1 : 1)).map((v) => {
      const c = Calc.calcVenda(v);
      return [UI.dataBR(v.data), v.nomeProduto, v.quantidade, dec(v.precoUnitario), dec(c.valorTotal), dec(v.custoUnitario), dec(c.custoTotal), dec(c.lucro), v.formaPagamento, v.observacao || '']
        .map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(';');
    });
    return '﻿' + [cab.join(';')].concat(linhas).join('\r\n');
  }

  function render() {
    const cfg = Store.get().configuracoes;
    return '' +
      '<div class="screen-head"><div><h1>Configurações</h1><div class="muted small">Versão ' + VERSAO_ATUAL + '</div></div></div>' +

      '<div class="card"><div class="card-title"><h3>Loja</h3></div>' +
        '<div class="field"><label for="cfg-nome">Nome exibido no painel</label>' +
        '<input id="cfg-nome" value="' + esc(cfg.nomeLoja) + '" data-act-change="config.nome"></div></div>' +

      '<div class="card"><div class="card-title"><h3>Backup e planilhas</h3></div>' +
        '<p class="muted small" style="margin-top:0">Os dados ficam salvos neste aparelho e navegador. Faça um backup de vez em quando.</p>' +
        '<div class="list" style="gap:10px">' +
          '<button class="btn btn-block btn-primary" data-act="config.exportar">Exportar backup (.json)</button>' +
          '<label class="btn btn-block" style="cursor:pointer">Importar backup<input type="file" accept="application/json,.json" data-act-change="config.importar" hidden></label>' +
          '<button class="btn btn-block" data-act="config.csv">Exportar vendas para planilha (.csv)</button>' +
        '</div></div>' +

      '<div class="card"><div class="card-title"><h3>Dados de exemplo</h3></div>' +
        '<p class="muted small" style="margin-top:0">Quer ver os gráficos funcionando antes de cadastrar os seus produtos? Carregue um histórico de 12 meses de exemplo. Ele é marcado como “Dado de exemplo”.</p>' +
        '<div class="list" style="gap:10px">' +
          '<button class="btn btn-block" data-act="config.exemplos">Carregar dados de exemplo</button>' +
          '<button class="btn btn-block btn-danger" data-act="config.apagar">Apagar todos os dados</button>' +
        '</div></div>' +

      '<div class="card"><div class="card-title"><h3>Versões</h3></div>' +
        NOVIDADES.map((v) =>
          '<div style="margin-bottom:14px"><div class="row spread"><strong>Versão ' + v.versao + '</strong>' +
          '<span class="badge ' + (v.versao === VERSAO_ATUAL ? 'b-ok' : 'b-parado') + '">' + v.status + '</span></div>' +
          '<ul class="muted small" style="margin:6px 0 0;padding-left:18px">' + v.itens.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul></div>'
        ).join('') +
      '</div>';
  }

  function depois(main) {
    const nome = main.querySelector('#cfg-nome');
    if (nome) nome.addEventListener('change', () => { Store.setConfig({ nomeLoja: nome.value.trim() || 'Maison de Lavande' }); UI.toast('Nome salvo'); });
  }

  function acao(nome, el) {
    if (nome === 'exportar') {
      const data = Calc.hojeISO().replace(/-/g, '');
      baixar('maison-de-lavande-backup-' + data + '.json', Store.exportarJSON(), 'application/json');
      return UI.toast('Backup baixado');
    }
    if (nome === 'csv') {
      const data = Calc.hojeISO().replace(/-/g, '');
      baixar('maison-de-lavande-vendas-' + data + '.csv', csvVendas(), 'text/csv;charset=utf-8');
      return UI.toast('Planilha de vendas baixada');
    }
    if (nome === 'exemplos') {
      if (!window.confirm('Carregar dados de exemplo? Isso substitui os dados atuais deste aparelho. Faça um backup antes, se já tiver registros.')) return;
      const ex = gerarExemplos();
      Store.carregarExemplos(ex.produtos, ex.vendas, ex.compras);
      UI.toast('Exemplos carregados');
      return root.App.rerender();
    }
    if (nome === 'apagar') {
      if (!window.confirm('Apagar TODOS os dados deste aparelho? Essa ação não pode ser desfeita.')) return;
      Store.limparTudo();
      UI.toast('Dados apagados');
      return root.App.rerender();
    }
  }

  function mudou(nome, el) {
    if (nome === 'importar') {
      const arquivo = el.files && el.files[0];
      if (!arquivo) return;
      if (!window.confirm('Importar este backup? Ele substitui os dados atuais deste aparelho.')) { el.value = ''; return; }
      const leitor = new FileReader();
      leitor.onload = () => {
        try {
          Store.importarJSON(String(leitor.result));
          UI.toast('Backup importado');
          root.App.rerender();
        } catch (e) {
          window.alert('Não foi possível importar: ' + e.message);
        }
      };
      leitor.readAsText(arquivo);
    }
  }

  root.Views = root.Views || {};
  root.Views.config = { render, depois, acao, mudou, VERSAO_ATUAL };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Maison de Lavande — inicialização, navegação inferior, seletor de mês e roteamento de ações.
 * Ações nos botões usam data-act="modulo.acao" (ex.: vendas.salvar, compras.repor, app.ir).
 */
(function (root) {
  'use strict';
  const Calc = root.Calc, Store = root.Store, UI = root.UI;

  const TELAS = [
    { id: 'painel', nome: 'Painel', icone: UI.ICONES.painel },
    { id: 'vendas', nome: 'Vendas', icone: UI.ICONES.vendas },
    { id: 'compras', nome: 'Compras', icone: UI.ICONES.compras },
    { id: 'estoque', nome: 'Estoque', icone: UI.ICONES.estoque },
    { id: 'produtos', nome: 'Produtos', icone: UI.ICONES.produtos },
  ];

  function main() { return document.getElementById('app'); }

  // Seletor de mês: não deixa avançar além do mês atual.
  function mesNav() {
    const atual = Calc.mesDe(Calc.hojeISO());
    const mes = UI.state.mes;
    return '<div class="card" style="padding:8px 10px;margin-bottom:0">' +
      '<div class="row spread">' +
        '<button class="btn btn-sm" data-act="app.mes" data-delta="-1" aria-label="Mês anterior">‹ Anterior</button>' +
        '<strong>' + Calc.nomeMes(mes) + '</strong>' +
        '<button class="btn btn-sm" data-act="app.mes" data-delta="1" aria-label="Próximo mês"' + (mes >= atual ? ' disabled' : '') + '>Próximo ›</button>' +
      '</div></div>';
  }

  function desenharCabecalho() {
    const cfg = Store.get().configuracoes;
    const topo = document.getElementById('topbar-brand');
    if (topo) topo.innerHTML = '<img class="brand-mark" src="icon-180.png" alt="">' +
      '<div style="min-width:0"><div class="brand-title">' + UI.esc(cfg.nomeLoja) + '</div>' +
      '<div class="brand-sub">Controle de vendas e estoque</div></div>';
  }

  function desenharAbas() {
    const barra = document.getElementById('tabbar');
    barra.innerHTML = TELAS.map((t) =>
      '<button class="tab" data-act="app.ir" data-tela="' + t.id + '"' +
      (UI.state.tela === t.id ? ' aria-current="page"' : '') + '>' +
        '<span class="ico">' + t.icone + '</span><span>' + t.nome + '</span></button>'
    ).join('');
  }

  function render() {
    const tela = UI.state.tela;
    const modulo = root.Views[tela] || root.Views.painel;
    const el = main();
    el.innerHTML = modulo.render();
    if (modulo.depois) modulo.depois(el);
    desenharAbas();
    desenharCabecalho();
    const topoConfig = document.getElementById('btn-config');
    if (topoConfig) topoConfig.setAttribute('aria-current', tela === 'config' ? 'page' : 'false');
  }

  function ir(tela) {
    UI.state.tela = tela;
    UI.fecharFolha();
    window.scrollTo(0, 0);
    render();
  }

  function mudarMes(delta) {
    const atual = Calc.mesDe(Calc.hojeISO());
    const proximo = Calc.deslocarMes(UI.state.mes, delta);
    if (proximo > atual) return;
    UI.state.mes = proximo;
    UI.state.cmpA = null;
    UI.state.cmpB = null;
    render();
  }

  // Roteia ações de clique: "modulo.acao".
  function tratarAcao(el) {
    const [modulo, nome] = String(el.dataset.act).split('.');
    if (modulo === 'app') {
      if (nome === 'mes') return mudarMes(Number(el.dataset.delta));
      if (nome === 'ir') return ir(el.dataset.tela);
      return;
    }
    const alvo = root.Views[modulo];
    if (alvo && alvo.acao) alvo.acao(nome, el);
  }

  function init() {
    Store.carregar();
    UI.state.mes = Calc.mesDe(Calc.hojeISO());
    UI.state.tela = 'painel';
    document.getElementById('btn-config').addEventListener('click', () => ir('config'));

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      if (el.tagName === 'LABEL') return;
      e.preventDefault();
      tratarAcao(el);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') UI.fecharFolha();
      if (e.key === 'Enter' && e.target.matches('[role="button"][data-act]')) tratarAcao(e.target);
    });
    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-act-change]');
      if (!el) return;
      const [modulo, nome] = String(el.dataset.actChange).split('.');
      const alvo = root.Views[modulo];
      if (alvo && alvo.mudou) alvo.mudou(nome, el);
    });

    render();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Sem suporte offline:', err));
    }
  }

  // Mantém o seletor de mês e a navegação dentro de Views (usados pelas telas).
  root.Views = root.Views || {};
  root.Views.mesNav = mesNav;
  root.App = { rerender: render, ir };

  document.addEventListener('DOMContentLoaded', init);
})(typeof self !== 'undefined' ? self : this);

</script>
</body>
</html>
